name: Frontend check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/frontend-check.yml'
  push:
    branches: [master, main]

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile (no emit)
        run: npx tsc --noEmit

      # Linting will be enabled once eslint config is in place.
      # - name: ESLint
      #   run: npx eslint src/ --max-warnings 0
