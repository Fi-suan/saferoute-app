name: Frontend check

on:
    pull_request:
        paths:
            - 'src/**'
            - 'App.tsx'
            - 'index.ts'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.json'
            - 'eslint.config.js'
            - '.github/workflows/frontend-check.yml'
    push:
        branches: [master, main]

jobs:
    check:
        name: Typecheck + lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: TypeScript compile (no emit)
              run: npx tsc --noEmit

            # Падает на ошибках. Предупреждения видны в логе, но сборку не валят:
            # см. комментарий в eslint.config.js про правила React Compiler.
            - name: ESLint
              run: npm run lint
