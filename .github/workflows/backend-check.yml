name: Backend check

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'
  push:
    branches: [master, main]

jobs:
  python:
    name: Lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    env:
      # Тесты гоняются на SQLite — отдельный Postgres для них не нужен.
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: ci-test-secret-please-replace
      DEBUG: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app/ alembic/

      - name: Import check (does the app boot?)
        run: python -c "from app.main import app; print('app imported OK, routes:', len(app.routes))"

      - name: Tests
        run: pytest tests/ -q
