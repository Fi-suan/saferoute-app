# Render.com Blueprint — SafeRoute / Sapa Jol
# Python FastAPI backend + external PostgreSQL (Neon)

services:
  - type: web
    name: saferoute-api
    env: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Миграции прогоняются перед стартом. Схему на чистой БД по-прежнему создаёт
    # create_all в lifespan — Alembic здесь отвечает за изменения существующей.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon PostgreSQL connection string — set in Render Dashboard
      - key: JWT_SECRET
        sync: false   # set in Render Dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false   # set in Render Dashboard
      - key: OPENAI_API_KEY
        sync: false   # set in Render Dashboard
      - key: S3_BUCKET
        sync: false   # хранилище фото — см. docs/photo-storage.md
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: "auto"
      - key: DEBUG
        value: "false"
      - key: BUFFER_ZONE_KM
        value: "5.0"
      - key: ALERT_RADIUS_KM
        value: "15.0"
      - key: DANGER_THRESHOLD_KM
        value: "3.0"
